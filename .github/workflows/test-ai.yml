# Живая проверка ИИ сервера (Groq/Cloudflare) без базы данных.
name: Проверить ИИ сервера
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**"]
    paths: ["supabase/functions/**", "supabase/tests/**", ".github/workflows/test-ai.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Тестовое фото
        run: |
          curl -sSL -A "ARISE-diagnostics/1.0 (github actions)" -o orig.jpg "https://upload.wikimedia.org/wikipedia/commons/6/6d/Good_Food_Display_-_NCI_Visuals_Online.jpg"
          python3 -m pip install -q pillow 2>/dev/null || pip install -q --break-system-packages pillow
          python3 -c "from PIL import Image; im=Image.open('orig.jpg').convert('RGB'); im.thumbnail((1024,1024)); im.save('food.jpg', quality=80)"
      - name: Уведомления (web-push в Deno)
        run: deno run -A supabase/tests/push_test.ts
      - name: Запросы к ИИ
        run: deno run -A supabase/tests/ai_test.ts food.jpg
      - name: Фото этикетки
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          from PIL import Image
          UA = {"User-Agent": "ARISE-ci/1.0 (github actions)"}
          q = "https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({"action": "query", "titles": "File:FDA Nutrition Facts Label 2014.jpg", "prop": "imageinfo", "iiprop": "url", "format": "json"})
          d = json.load(urllib.request.urlopen(urllib.request.Request(q, headers=UA)))
          url = list(d["query"]["pages"].values())[0]["imageinfo"][0]["url"]
          open("label_orig", "wb").write(urllib.request.urlopen(urllib.request.Request(url, headers=UA)).read())
          im = Image.open("label_orig").convert("RGB"); im.thumbnail((1400, 1400)); im.save("label.jpg", quality=85); print(url, im.size)
          PY
      - name: Штрихкоды (Open Food Facts + этикетка)
        run: deno run -A supabase/tests/barcode_test.ts label.jpg
