# Напоминание в Telegram-группу Feel it: проверить задачи на сайте.
# Секреты (Settings → Secrets and variables → Actions):
#   TG_TOKEN   — токен бота от @BotFather
#   TG_CHAT_ID — id группы (после первого запуска; см. лог)
name: Напоминание в Telegram
on:
  schedule:
    - cron: "52 6 * * *"    # ≈ 12:00 по Ташкенту (GitHub иногда запускает на 5–15 мин позже)
    - cron: "52 11 * * *"   # ≈ 17:00 по Ташкенту
  workflow_dispatch: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Отправить напоминание
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          cat > remind.mjs <<'JS'
          const SITE = "https://surenambarsumov642-afk.github.io/feelit-team/";
          const { TG_TOKEN } = process.env; let CHAT = process.env.TG_CHAT_ID;
          if (!TG_TOKEN) throw new Error("Нет секрета TG_TOKEN");
          const tg = (m, b) => fetch(`https://api.telegram.org/bot${TG_TOKEN}/${m}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b || {}) }).then(r => r.json());
          if (!CHAT) {
            const u = await tg("getUpdates");
            const chats = (u.result || []).map(x => (x.message || x.my_chat_member || x.channel_post || {}).chat).filter(c => c && c.type !== "private");
            if (!chats.length) throw new Error("Группа не найдена: добавьте бота в группу, напишите там любое сообщение и запустите снова");
            CHAT = String(chats.at(-1).id);
            console.log(`>>> TG_CHAT_ID = ${CHAT}  (группа «${chats.at(-1).title}») — сохраните это число в секрет TG_CHAT_ID`);
          }
          const h = (new Date().getUTCHours() + 5) % 24;
          const text = h < 15
            ? `🔔 <b>Дневная проверка задач Feel It</b>\n\nЗагляните на сайт: обновите статусы, отметьте чек-листы и напишите короткий отчёт по своим задачам 🤍\n\n<a href="${SITE}">Открыть задачи</a>`
            : `🔔 <b>Вечерняя проверка задач Feel It</b>\n\nОтметьте, что успели сегодня, и сдайте готовое на проверку.\nНе успеваете к сроку — нажмите «Попросить перенос», чтобы не терять баллы 🙏\n\n<a href="${SITE}">Открыть задачи</a>`;
          const r = await tg("sendMessage", { chat_id: CHAT, text, parse_mode: "HTML", disable_web_page_preview: true });
          if (!r.ok) throw new Error("Telegram: " + JSON.stringify(r));
          console.log("Напоминание отправлено");
          JS
          node remind.mjs
