# Разворачивает сервер ARISE в Supabase: таблица игроков + функция arise + ключ ИИ (Claude).
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF  — id проекта (из адреса https://<id>.supabase.co)
#   GROQ_API_KEY          — console.groq.com/keys (бесплатный ИИ: текст и фото)
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN — запасной бесплатный ИИ для фото (Workers AI)
#   ANTHROPIC_API_KEY     — необязательно: если задан, ИИ идёт через Claude Haiku 5.5
name: Развернуть сервер ARISE
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-backend.yml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверить секреты
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Нет секрета SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$REF" ] || { echo "Нет секрета SUPABASE_PROJECT_REF"; exit 1; }
          [ -n "${{ secrets.GROQ_API_KEY }}${{ secrets.ANTHROPIC_API_KEY }}" ] || { echo "Нет ключа ИИ: GROQ_API_KEY или ANTHROPIC_API_KEY"; exit 1; }
      - name: Создать таблицу
        run: |
          code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -Rs '{query: .}' supabase/schema.sql)")
          cat resp.txt; echo
          [ "$code" -lt 300 ] || { echo "Ошибка SQL ($code)"; exit 1; }
      - name: Расписание напоминаний (pg_cron)
        run: |
          sed "s#__URL__#https://$REF.supabase.co/functions/v1/arise#g" supabase/cron.sql > cron.sql
          code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$(jq -Rs '{query: .}' cron.sql)")
          cat resp.txt; echo
          [ "$code" -lt 300 ] || { echo "Ошибка расписания ($code)"; exit 1; }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Сохранить ключи ИИ на сервере
        env:
          GROQ: ${{ secrets.GROQ_API_KEY }}
          CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANT: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=()
          [ -n "$GROQ" ] && args+=("GROQ_API_KEY=$GROQ")
          [ -n "$CF_ID" ] && args+=("CLOUDFLARE_ACCOUNT_ID=$CF_ID")
          [ -n "$CF_TOKEN" ] && args+=("CLOUDFLARE_API_TOKEN=$CF_TOKEN")
          [ -n "$ANT" ] && args+=("ANTHROPIC_API_KEY=$ANT")
          supabase secrets set --yes --project-ref "$REF" "${args[@]}"
      - name: Развернуть функцию
        run: supabase functions deploy arise --yes --project-ref "$REF" --no-verify-jwt
      - name: Проверка
        run: |
          curl -sS -X POST "https://$REF.supabase.co/functions/v1/arise" -H "Content-Type: application/json" -d '{"action":"leaderboard"}'
          echo; echo "Адрес сервера: https://$REF.supabase.co/functions/v1/arise"
