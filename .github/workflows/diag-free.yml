# Проверка бесплатных ИИ: Groq (текст) и Cloudflare Workers AI (фото). Ключи в логах скрыты GitHub. 
name: Проверить бесплатный ИИ
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diag-free.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      GROQ: ${{ secrets.GROQ_API_KEY }}
      CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Groq — модели и пробный запрос
        run: |
          [ -n "$GROQ" ] || { echo "Нет GROQ_API_KEY"; exit 0; }
          curl -sS https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ" -o m.json -w "models HTTP %{http_code}\n"
          jq -r '.error.message // empty' m.json; jq -r '.data[]?.id' m.json | sort
          for m in $(jq -r '.data[]?.id' m.json | grep -iE "gpt-oss-120b|llama-3.3-70b|llama-4|qwen|kimi|deepseek" | head -6); do
            code=$(curl -sS -o o.json -w "%{http_code}" https://api.groq.com/openai/v1/chat/completions -H "Authorization: Bearer $GROQ" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"response_format\":{\"type\":\"json_object\"},\"max_tokens\":300,\"messages\":[{\"role\":\"user\",\"content\":\"Верни JSON {\\\"plan\\\": [три коротких шага, как начать учить Python, по-русски]}\"}]}")
            echo "== $m: HTTP $code"; jq -c '.error.message // .choices[0].message.content' o.json | head -c 500; echo
          done
      - name: Cloudflare — модели с картинками и пробный запрос
        run: |
          [ -n "$CF_ID" ] && [ -n "$CF_TOKEN" ] || { echo "Нет CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN"; exit 0; }
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ID/ai/models/search?per_page=200" -H "Authorization: Bearer $CF_TOKEN" -o cm.json -w "models HTTP %{http_code}\n"
          jq -c '.errors // empty' cm.json
          jq -r '.result[]? | select(((.task.name // "") | test("Image|Text Generation")) ) | "\(.name)\t\(.task.name)\t\([.properties[]? | select(.property_id=="vision" or .property_id=="function_calling") | .property_id] | join(","))"' cm.json | grep -iE "vision|Image-to-Text|llama-3.2-11b|llama-4|gemma|qwen|mistral-small" | head -30
          # пробное фото: тарелка с едой (картинка из Википедии)
          curl -sSL -o food.jpg "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Good_Food_Display_-_NCI_Visuals_Online.jpg/640px-Good_Food_Display_-_NCI_Visuals_Online.jpg"
          B64=$(base64 -w0 food.jpg)
          for m in $(jq -r '.result[]? | select([.properties[]? | .property_id] | index("vision")) | .name' cm.json | head -5) "@cf/meta/llama-4-scout-17b-16e-instruct" "@cf/meta/llama-3.2-11b-vision-instruct"; do
            jq -n --arg img "data:image/jpeg;base64,$B64" '{max_tokens:400, messages:[{role:"user",content:[{type:"text",text:"Перечисли продукты на фото и примерные калории каждого. Ответ JSON {\"items\":[{\"name\":\"\",\"kcal\":0}]} по-русски."},{type:"image_url",image_url:{url:$img}}]}]}' > req.json
            code=$(curl -sS -o o.json -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/$CF_ID/ai/run/$m" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d @req.json)
            echo "== $m: HTTP $code"; jq -c '.errors // .result.response // .result' o.json | head -c 600; echo
          done
