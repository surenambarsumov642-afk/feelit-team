<style>
  :root{
    --burg:#4A0D12; --burg2:#6b1a22; --rose:#efe4e2; --rose2:#f7f0ee; --line:#e6d9d7;
    --text:#2b1416; --muted:#8a6f72; --ok:#2f7a4a; --warn:#b5651d; --bad:#b3261e; --bg:#fbf8f7;

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif;font-size:15px}
  button,input,select,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}
  header{position:sticky;top:0;z-index:5;background:var(--burg);color:#fff;padding:10px 16px calc(10px) 16px;display:flex;align-items:center;gap:12px}

  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}

  .task .top{display:flex;gap:8px;align-items:flex-start}

/* ------------------------- helpers ------------------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = s => { if (!s) return ""; const [y, m, d] = s.split("-"); const days = ["вс","пн","вт","ср","чт","пт","сб"]; const wd = days[new Date(+y, m - 1, +d).getDay()]; return `${wd} ${d}.${m}`; };
const fmtTime = ms => { if (!ms) return ""; const d = new Date(ms); return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); };
const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;
const fmtNum = v => v == null ? "—" : Number(v).toLocaleString("ru-RU");
const loginToEmail = l => `${l.trim().toLowerCase()}@${LOGIN_DOMAIN}`;
const emailToLogin = e => (e || "").split("@")[0];
const mondayOf = s => { const [y, m, d] = s.split("-").map(Number); const dt = new Date(y, m - 1, d); const k = (dt.getDay() + 6) % 7; dt.setDate(dt.getDate() - k); return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`; };
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
const STATUS = { todo: "Не начато", doing: "В работе", done: "Готово" };

/* ===================== BACKEND: Firebase ===================== */
async function firebaseBackend() {
  const V = "10.12.2";
  const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const authMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = appMod.initializeApp(FIREBASE_CONFIG);
  const auth = authMod.getAuth(app);
  const db = fs.getFirestore(app);
  let current = null;

  return {
    onAuth(cb) {
      authMod.onAuthStateChanged(auth, async u => {
        if (!u) { current = null; return cb(null); }
        const login = emailToLogin(u.email);
        current = { uid: u.uid, login, isAdmin: login === ADMIN_LOGIN };
        if (current.isAdmin) {
          const ref = fs.doc(db, "users", u.uid);
          const snap = await fs.getDoc(ref);
          if (!snap.exists()) await fs.setDoc(ref, { login, name: "Сурен", role: "admin", createdAt: Date.now() });
        }
        cb(current);
      });
    },
    async signIn(login, pass) { await authMod.signInWithEmailAndPassword(auth, loginToEmail(login), pass); },
    async createAdmin(pass) { await authMod.createUserWithEmailAndPassword(auth, loginToEmail(ADMIN_LOGIN), pass); },
    async signOut() { await authMod.signOut(auth); },
    async changePassword(oldPass, newPass) {
      const u = auth.currentUser;
      const cred = authMod.EmailAuthProvider.credential(u.email, oldPass);
      await authMod.reauthenticateWithCredential(u, cred);
      await authMod.updatePassword(u, newPass);
    },
    watchUsers(cb) { return fs.onSnapshot(fs.collection(db, "users"), s => cb(s.docs.map(d => ({ uid: d.id, ...d.data() })))); },
    async createUser(login, name, pass) {
      // второй экземпляр приложения, чтобы админ не вылетел из своего аккаунта
      const sec = appMod.initializeApp(FIREBASE_CONFIG, "sec-" + Date.now());
      const secAuth = authMod.getAuth(sec);
      try {
        const cred = await authMod.createUserWithEmailAndPassword(secAuth, loginToEmail(login), pass);
        await fs.setDoc(fs.doc(db, "users", cred.user.uid), { login: login.trim().toLowerCase(), name, role: "member", createdAt: Date.now() });
        await authMod.signOut(secAuth);
      } finally { await appMod.deleteApp(sec); }
    },
    async removeUser(uid) { await fs.deleteDoc(fs.doc(db, "users", uid)); },
    watchTasks(cb) { return fs.onSnapshot(fs.collection(db, "tasks"), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })))); },
    async addTask(t) { await fs.addDoc(fs.collection(db, "tasks"), { ...t, createdAt: Date.now(), updatedAt: Date.now() }); },
    async updateTask(id, patch) { await fs.updateDoc(fs.doc(db, "tasks", id), { ...patch, updatedAt: Date.now() }); },
    async removeTask(id) { await fs.deleteDoc(fs.doc(db, "tasks", id)); },
    watchReports(taskId, cb) {
      const q = fs.query(fs.collection(db, "tasks", taskId, "reports"), fs.orderBy("createdAt", "asc"));
      return fs.onSnapshot(q, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))));
    },
    async addReport(taskId, text) {
      await fs.addDoc(fs.collection(db, "tasks", taskId, "reports"), { author: current.uid, text, createdAt: Date.now() });
      await fs.updateDoc(fs.doc(db, "tasks", taskId), { lastReport: Date.now(), updatedAt: Date.now() }).catch(() => {});
    },
    watchKpi(cb) { return fs.onSnapshot(fs.collection(db, "kpi"), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })))); },
    async saveKpi(id, data) { await fs.setDoc(fs.doc(db, "kpi", id), { ...data, updatedAt: Date.now() }, { merge: true }); },
    async removeKpi(id) { await fs.deleteDoc(fs.doc(db, "kpi", id)); },
  };
}

/* ===================== BACKEND: demo (в памяти) ===================== */
function demoBackend() {
  const L = new Set(); const emit = () => L.forEach(f => f());
  const users = TEAM_SEED.map((p, i) => ({ uid: "u" + i, login: p.login, name: p.name, role: p.login === ADMIN_LOGIN ? "admin" : "member" }));
  const tasks = []; const reports = {}; const kpi = [];
  let current = null; let authCb = null; let n = 1;
  const api = {
    onAuth(cb) { authCb = cb; cb(null); },
    async signIn(login) { const u = users.find(x => x.login === login.trim().toLowerCase()); if (!u) throw { code: "auth/invalid-credential" }; current = { uid: u.uid, login: u.login, isAdmin: u.login === ADMIN_LOGIN }; authCb(current); },
    async createAdmin() { return api.signIn(ADMIN_LOGIN); },
    async signOut() { current = null; authCb(null); },
    async changePassword() {},
    watchUsers(cb) { const f = () => cb(users.map(u => ({ ...u }))); L.add(f); f(); return () => L.delete(f); },
    async createUser(login, name) { users.push({ uid: "u" + (n++ + 10), login: login.trim().toLowerCase(), name, role: "member" }); emit(); },
    async removeUser(uid) { const i = users.findIndex(u => u.uid === uid); if (i >= 0) users.splice(i, 1); emit(); },
    watchTasks(cb) { const f = () => cb(tasks.map(t => ({ ...t }))); L.add(f); f(); return () => L.delete(f); },
    async addTask(t) { tasks.push({ id: "t" + n++, ...t, createdAt: Date.now(), updatedAt: Date.now() }); emit(); },
    async updateTask(id, p) { Object.assign(tasks.find(t => t.id === id), p, { updatedAt: Date.now() }); emit(); },
    async removeTask(id) { tasks.splice(tasks.findIndex(t => t.id === id), 1); emit(); },
    watchReports(id, cb) { const f = () => cb((reports[id] || []).slice()); L.add(f); f(); return () => L.delete(f); },
    async addReport(id, text) { (reports[id] ||= []).push({ id: "r" + n++, author: current.uid, text, createdAt: Date.now() }); const t = tasks.find(x => x.id === id); if (t) t.lastReport = Date.now(); emit(); },
    watchKpi(cb) { const f = () => cb(kpi.map(k => ({ ...k }))); L.add(f); f(); return () => L.delete(f); },
    async saveKpi(id, data) { const k = kpi.find(x => x.id === id); if (k) Object.assign(k, data); else kpi.push({ id, ...data }); emit(); },
    async removeKpi(id) { kpi.splice(kpi.findIndex(k => k.id === id), 1); emit(); },
  };
  return api;
}

/* ===================== KPI поля ===================== */
const KPI_FIELDS = [
  { key: "orders", label: "Заказы, шт" },
  { key: "revenue", label: "Выручка, сум" },
  { key: "grud", label: "Нагрудники, шт" },
  { key: "followers", label: "Подписчики (всего)" },
  { key: "reach", label: "Просмотры рилсов" },

];

/* ===================== APP ===================== */
let B, ME = null, USERS = [], TASKS = [], KPI = [];
let VIEW = "mine", FILTER = "open", unsub = [];

const userName = uid => USERS.find(u => u.uid === uid)?.name || "—";
const uidByLogin = l => USERS.find(u => u.login === l)?.uid;
const initials = name => (name || "?").trim()[0]?.toUpperCase() || "?";

function isOverdue(t) { return t.status !== "done" && t.deadline && t.deadline < todayStr(); }
function canEdit(t) { return ME.isAdmin || (t.assignees || []).includes(ME.uid); }

function deadlineChip(t) {
  if (!t.deadline) return `<span class="chip">без срока</span>`;
  if (isOverdue(t)) return `<span class="chip over">просрочено · ${fmtDate(t.deadline)}</span>`;
  if (t.deadline === todayStr() && t.status !== "done") return `<span class="chip today">сегодня</span>`;
  return `<span class="chip">до ${fmtDate(t.deadline)}</span>`;
}
function statusChip(t) { const s = t.status || "todo"; return `<span class="chip st-${s}">${STATUS[s]}</span>`; }

function taskCard(t, showWho = true) {
  const who = (t.assignees || []).map(userName).join(", ");
  return `<div class="card task ${t.status === "done" ? "done" : ""}" data-task="${t.id}">
    <div class="top"><div class="title">${esc(t.title)}</div></div>
    <div class="chips">${statusChip(t)}${deadlineChip(t)}${showWho ? `<span class="chip">${esc(who)}</span>` : ""}${t.lastReport ? `<span class="chip">отчёт ${fmtTime(t.lastReport)}</span>` : ""}</div>
  </div>`;
}

function sortTasks(list) {
  const rank = t => t.status === "done" ? 3 : isOverdue(t) ? 0 : t.deadline ? 1 : 2;
  return list.slice().sort((a, b) => rank(a) - rank(b) || (a.deadline || "9").localeCompare(b.deadline || "9") || (a.createdAt || 0) - (b.createdAt || 0));
}
function applyFilter(list) {
  if (FILTER === "open") return list.filter(t => t.status !== "done");
  if (FILTER === "over") return list.filter(isOverdue);
  if (FILTER === "done") return list.filter(t => t.status === "done");
  return list;
}
function filtersHtml() {
  const f = [["open", "Активные"], ["over", "Просроченные"], ["done", "Готово"], ["all", "Все"]];
  return `<div class="filters">${f.map(([k, l]) => `<button data-filter="${k}" class="${FILTER === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
}

/* ---------- views ---------- */
function viewMine() {
  const mine = TASKS.filter(t => (t.assignees || []).includes(ME.uid));
  const open = mine.filter(t => t.status !== "done").length, over = mine.filter(isOverdue).length, done = mine.filter(t => t.status === "done").length;
  const list = sortTasks(applyFilter(mine));
  return `<h2>Мои задачи</h2>
    <div class="stat"><div class="card"><b>${open}</b><span class="small muted">активные</span></div>
    <div class="card"><b style="color:${over ? "var(--bad)" : "var(--burg)"}">${over}</b><span class="small muted">просрочено</span></div>

function svgChart(points, color = "#4A0D12") {
  const W = 300, H = 120, P = 26;
  if (!points.length) return `<div class="small muted">Нет данных</div>`;
  const max = Math.max(...points.map(p => p.v), 1);
  const bw = Math.min(36, (W - P) / points.length - 8);
  const bars = points.map((p, i) => {
    const x = P + i * ((W - P) / points.length) + 4; const h = Math.round((p.v / max) * (H - 34)); const y = H - 18 - h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${p.base ? "#c9b3b0" : color}"/>
      <text x="${x + bw / 2}" y="${y - 4}" font-size="9" text-anchor="middle" fill="#2b1416">${fmtNum(p.v)}</text>
      <text x="${x + bw / 2}" y="${H - 5}" font-size="9" text-anchor="middle" fill="#8a6f72">${esc(p.l)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${bars}</svg>`;
}

function kpiRows() { return KPI.slice().sort((a, b) => (a.base ? -1 : b.base ? 1 : a.id.localeCompare(b.id))); }
function onTimePct(weekId) {
  if (weekId.startsWith("base")) return null;
  const start = weekId; const endD = new Date(weekId); endD.setDate(endD.getDate() + 6); const end = endD.toISOString().slice(0, 10);
  const due = TASKS.filter(t => t.deadline && t.deadline >= start && t.deadline <= end);
  if (!due.length) return null;
  const ok = due.filter(t => t.status === "done" && (!t.doneAt || t.doneAt <= t.deadline)).length;
  return Math.round(ok / due.length * 100);
}
function weekLabel(k, short) { if (k.base) return short ? "октябрь" : (k.label || "база"); const [, m, d] = k.id.split("-"); return `${d}.${m}`; }

function viewKpi() {

  const head = `<tr><th>Неделя</th>${KPI_FIELDS.map(f => `<th>${f.label}</th>`).join("")}<th>Задачи вовремя</th></tr>`;
  const body = rows.slice().reverse().map(r => {

  return `<div class="row"><h2 class="grow">KPI</h2>${ME.isAdmin ? `<button class="btn" data-act="new-kpi">+ Неделя</button>` : ""}</div>
    <div class="small muted" style="margin:0 4px 10px">Цифры вносятся раз в неделю. Серый столбик — точка отсчёта (октябрь). «Задачи вовремя» считается сам по задачам со сроком на этой неделе.</div>

    <div class="card"><label>Логин</label><input id="l-login" autocapitalize="off" autocomplete="username" placeholder="например, damir">

    <div class="err" id="l-err">${esc(msg)}</div>
    <button class="btn" style="width:100%" id="l-go">Войти</button>
    ${DEMO ? `<div class="small muted" style="margin-top:10px">Демо: войдите как suren, damir, kamilla или abbos (пароль любой).</div>` : ""}
    <div id="l-admin" class="hidden" style="margin-top:12px"><div class="small muted">Аккаунта администратора ещё нет. Создать вход «${ADMIN_LOGIN}» с этим паролем?</div><button class="btn sec" style="width:100%;margin-top:8px" id="l-create">Создать вход администратора</button></div></div></div>`;
  const go = async () => {
    const login = $("#l-login").value.trim(), pass = $("#l-pass").value;
    if (!login || !pass) { $("#l-err").textContent = "Введите логин и пароль"; return; }
    $("#l-go").disabled = true; $("#l-err").textContent = "";
    try { await B.signIn(login, pass); }
    catch (e) {
      $("#l-go").disabled = false;
      const code = e?.code || "";
      if (code.includes("too-many")) $("#l-err").textContent = "Слишком много попыток, подождите пару минут";
      else $("#l-err").textContent = "Неверный логин или пароль";
      if (login.toLowerCase() === ADMIN_LOGIN && (code.includes("invalid-credential") || code.includes("user-not-found"))) $("#l-admin").classList.remove("hidden");
    }
  };
  $("#l-go").onclick = go;
  $("#l-pass").onkeydown = e => { if (e.key === "Enter") go(); };
  $("#l-create").onclick = async () => {
    const pass = $("#l-pass").value;
    if (pass.length < 6) { $("#l-err").textContent = "Пароль минимум 6 символов"; return; }
    try { await B.createAdmin(pass); } catch (e) { $("#l-err").textContent = (e?.code || "").includes("email-already") ? "Администратор уже есть — проверьте пароль" : "Не получилось: " + (e?.code || e); }

function renderMain() {

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-view],[data-filter],[data-task],[data-act],[data-close],[data-status],[data-addreport],[data-edittask],[data-deltask],[data-savetask],[data-kpi],[data-savekpi],[data-delkpi],[data-saveuser],[data-rmuser],[data-savepass]");
  if (!el) { if (e.target.id === "sheet") closeSheet(); return; }
  const d = el.dataset;
  try {
    if (d.view) { VIEW = d.view; renderMain(); window.scrollTo(0, 0); }
    else if (d.filter) { FILTER = d.filter; renderMain(); }
    else if (d.task) sheetTask(d.task);
    else if ("close" in d) closeSheet();
    else if (d.act === "new-task") sheetTaskForm();
    else if (d.act === "new-kpi") sheetKpi();
    else if (d.act === "new-user") sheetUser();
    else if (d.act === "change-pass") sheetPass();
    else if (d.act === "seed-kpi") { await B.saveKpi("base-2026-10", { base: true, label: "Октябрь 2026 (4–29.10)", orders: 14, revenue: 4562000, grud: 1 }); toast("Октябрь добавлен"); }
    else if (d.act === "seed") {
      const missing = [...new Set(WEEK_TASKS.flatMap(t => t.who))].filter(l => !uidByLogin(l));
      if (missing.length && !confirm(`Нет входов для: ${missing.join(", ")}. Их задачи загрузятся без исполнителя. Продолжить?`)) return;
      for (const t of WEEK_TASKS) await B.addTask({ title: t.title, desc: t.desc, deadline: t.deadline, status: "todo", assignees: t.who.map(uidByLogin).filter(Boolean), createdBy: ME.uid });
      toast("Задачи недели загружены");
    }
    else if (d.status) {
      const patch = { status: d.status }; if (d.status === "done") patch.doneAt = todayStr(); else patch.doneAt = null;
      await B.updateTask(d.id, patch); closeSheet(); toast("Статус обновлён");
    }
    else if (d.addreport) {
      const text = $("#rtext").value.trim(); if (!text) return;
      el.disabled = true; await B.addReport(d.addreport, text); $("#rtext").value = ""; el.disabled = false; toast("Отчёт отправлен");
    }
    else if (d.edittask) { const t = TASKS.find(x => x.id === d.edittask); closeSheet(); sheetTaskForm(t); }
    else if (d.deltask) { if (confirm("Удалить задачу?")) { await B.removeTask(d.deltask); closeSheet(); } }
    else if ("savetask" in d) {
      const title = $("#f-title").value.trim();
      const assignees = [...document.querySelectorAll("#f-who input:checked")].map(i => i.value);
      if (!title) { $("#f-err").textContent = "Напишите задачу"; return; }
      if (!assignees.length) { $("#f-err").textContent = "Выберите, кто делает"; return; }
      const data = { title, desc: $("#f-desc").value.trim(), deadline: $("#f-deadline").value, assignees };
      if (d.savetask) await B.updateTask(d.savetask, data); else await B.addTask({ ...data, status: "todo", createdBy: ME.uid });
      closeSheet(); toast(d.savetask ? "Сохранено" : "Задача создана");
    }
    else if (d.kpi) sheetKpi(d.kpi);
    else if ("savekpi" in d) {
      const data = {}; KPI_FIELDS.forEach(f => data[f.key] = num($("#k-" + f.key).value)); data.note = $("#k-note").value.trim();
      let id = d.savekpi;
      if (!id || !id.startsWith("base")) { const w = $("#k-week").value; if (!w) return; const nid = mondayOf(w); if (id && id !== nid) await B.removeKpi(id); id = nid; }
      await B.saveKpi(id, data); closeSheet(); toast("Цифры сохранены");
    }
    else if (d.delkpi) { if (confirm("Удалить эту неделю?")) { await B.removeKpi(d.delkpi); closeSheet(); } }
    else if ("saveuser" in d) {
      const name = $("#u-name").value.trim(), login = $("#u-login").value.trim().toLowerCase(), pass = $("#u-pass").value;
      if (!name || !/^[a-z0-9._-]{2,}$/.test(login)) { $("#u-err").textContent = "Имя и логин латиницей, без пробелов"; return; }
      if (pass.length < 6) { $("#u-err").textContent = "Пароль минимум 6 символов"; return; }
      if (USERS.some(u => u.login === login)) { $("#u-err").textContent = "Такой логин уже есть"; return; }
      el.disabled = true;
      try { await B.createUser(login, name, pass); closeSheet(); toast(`Вход создан: ${login}`); }
      catch (err) { el.disabled = false; $("#u-err").textContent = (err?.code || "").includes("email-already") ? "Такой логин уже занят" : "Не получилось: " + (err?.code || err); }
    }
    else if (d.rmuser) { if (confirm("Убрать участника из команды? Его вход перестанет открывать сайт.")) await B.removeUser(d.rmuser); }
    else if ("savepass" in d) {
      const o = $("#p-old").value, n = $("#p-new").value;
      if (n.length < 6) { $("#p-err").textContent = "Минимум 6 символов"; return; }
      try { await B.changePassword(o, n); closeSheet(); toast("Пароль изменён"); } catch { $("#p-err").textContent = "Текущий пароль неверный"; }
    }
  } catch (err) { console.error(err); toast("Ошибка: " + (err?.code || err?.message || err)); }
});

(async () => {
  if (DEMO) $("#banner").classList.remove("hidden");
  try { B = DEMO ? demoBackend() : await firebaseBackend(); }
  catch (e) { $("#app").innerHTML = `<div class="empty">Не удалось подключиться к Firebase. Проверьте настройки.</div>`; console.error(e); return; }
  B.onAuth(user => {
    unsub.forEach(f => f && f()); unsub = []; closeSheet();
    ME = user; VIEW = "mine"; FILTER = "open";
    if (!user) return renderLogin();
    renderShell();
    unsub.push(B.watchUsers(u => { USERS = u; renderMain(); const me = USERS.find(x => x.uid === ME.uid); const w = $(".who"); if (w && me) w.textContent = me.name + (ME.isAdmin ? " · админ" : ""); }));
    unsub.push(B.watchTasks(t => { TASKS = t; renderMain(); }));
    unsub.push(B.watchKpi(k => { KPI = k; renderMain(); }));
  });
})();
</script>
</body>
</html>
