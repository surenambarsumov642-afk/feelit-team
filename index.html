/* ------------------------- helpers ------------------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = s => { if (!s) return ""; const [y, m, d] = s.split("-"); const days = ["вс","пн","вт","ср","чт","пт","сб"]; const wd = days[new Date(+y, m - 1, +d).getDay()]; return `${wd} ${d}.${m}`; };
const fmtTime = ms => { if (!ms) return ""; const d = new Date(ms); return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); };
const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;
const fmtNum = v => v == null ? "—" : Number(v).toLocaleString("ru-RU");
const loginToEmail = l => `${l.trim().toLowerCase()}@${LOGIN_DOMAIN}`;
const emailToLogin = e => (e || "").split("@")[0];
const mondayOf = s => { const [y, m, d] = s.split("-").map(Number); const dt = new Date(y, m - 1, d); const k = (dt.getDay() + 6) % 7; dt.setDate(dt.getDate() - k); return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`; };
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
const STATUS = { todo: "Не начато", doing: "В работе", review: "На проверке", done: "Готово" };
const REPEAT = { "": "не повторять", day: "каждый день", week: "каждую неделю", month: "каждый месяц" };

/* ===================== BACKEND: Firebase ===================== */
async function firebaseBackend() {
  const V = "10.12.2";
  const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const authMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = appMod.initializeApp(FIREBASE_CONFIG);
  const auth = authMod.getAuth(app);
  const db = fs.getFirestore(app);
  let current = null;

  return {
    onAuth(cb) {
      authMod.onAuthStateChanged(auth, async u => {
        if (!u) { current = null; return cb(null); }
        const login = emailToLogin(u.email);
        current = { uid: u.uid, login, isAdmin: login === ADMIN_LOGIN };
        if (current.isAdmin) {
          const ref = fs.doc(db, "users", u.uid);
          const snap = await fs.getDoc(ref);
          if (!snap.exists()) await fs.setDoc(ref, { login, name: "Сурен", role: "admin", createdAt: Date.now() });
        }
        cb(current);
      });
    },
    async signIn(login, pass) { await authMod.signInWithEmailAndPassword(auth, loginToEmail(login), pass); },
    async createAdmin(pass) { await authMod.createUserWithEmailAndPassword(auth, loginToEmail(ADMIN_LOGIN), pass); },
    async signOut() { await authMod.signOut(auth); },
    async changePassword(oldPass, newPass) {
      const u = auth.currentUser;
      const cred = authMod.EmailAuthProvider.credential(u.email, oldPass);
      await authMod.reauthenticateWithCredential(u, cred);
      await authMod.updatePassword(u, newPass);
    },
    watchUsers(cb) { return fs.onSnapshot(fs.collection(db, "users"), s => cb(s.docs.map(d => ({ uid: d.id, ...d.data() })))); },
    async createUser(login, name, pass) {
      // второй экземпляр приложения, чтобы админ не вылетел из своего аккаунта
      const sec = appMod.initializeApp(FIREBASE_CONFIG, "sec-" + Date.now());
      const secAuth = authMod.getAuth(sec);
      try {
        const cred = await authMod.createUserWithEmailAndPassword(secAuth, loginToEmail(login), pass);
        await fs.setDoc(fs.doc(db, "users", cred.user.uid), { login: login.trim().toLowerCase(), name, role: "member", createdAt: Date.now() });
        await authMod.signOut(secAuth);
      } finally { await appMod.deleteApp(sec); }
    },
    async removeUser(uid) { await fs.deleteDoc(fs.doc(db, "users", uid)); },
    watchTasks(cb) { return fs.onSnapshot(fs.collection(db, "tasks"), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })))); },
    async addTask(t) { await fs.addDoc(fs.collection(db, "tasks"), { ...t, history: [{ at: Date.now(), by: current.uid, text: "Создал(а) задачу" }], createdAt: Date.now(), updatedAt: Date.now() }); },
    async updateTask(id, patch, log) {
      const p = { ...patch, updatedAt: Date.now() };
      if (log) p.history = fs.arrayUnion({ at: Date.now(), by: current.uid, text: log });
      await fs.updateDoc(fs.doc(db, "tasks", id), p);
    },
    async removeTask(id) { await fs.deleteDoc(fs.doc(db, "tasks", id)); },
    watchReports(taskId, cb) {
      const q = fs.query(fs.collection(db, "tasks", taskId, "reports"), fs.orderBy("createdAt", "asc"));
      return fs.onSnapshot(q, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))));
    },
    async addReport(taskId, text) {
      await fs.addDoc(fs.collection(db, "tasks", taskId, "reports"), { author: current.uid, text, createdAt: Date.now() });
      await fs.updateDoc(fs.doc(db, "tasks", taskId), { lastReport: Date.now(), updatedAt: Date.now() }).catch(() => {});
    },
    watchKpi(cb) { return fs.onSnapshot(fs.collection(db, "kpi"), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })))); },
    async saveKpi(id, data) { await fs.setDoc(fs.doc(db, "kpi", id), { ...data, updatedAt: Date.now() }, { merge: true }); },
    async removeKpi(id) { await fs.deleteDoc(fs.doc(db, "kpi", id)); },
    watchPoints(cb) { return fs.onSnapshot(fs.collection(db, "points"), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })))); },
    async addPoints(p) { await fs.addDoc(fs.collection(db, "points"), { ...p, by: current.uid, at: Date.now() }); },
    async removePoints(id) { await fs.deleteDoc(fs.doc(db, "points", id)); },
  };
}

/* ===================== BACKEND: demo (в памяти) ===================== */
function demoBackend() {
  const L = new Set(); const emit = () => L.forEach(f => f());
  const users = TEAM_SEED.map((p, i) => ({ uid: "u" + i, login: p.login, name: p.name, role: p.login === ADMIN_LOGIN ? "admin" : "member" }));
  const tasks = []; const reports = {}; const kpi = []; const pts = [];
  let current = null; let authCb = null; let n = 1;
  const api = {
    onAuth(cb) { authCb = cb; cb(null); },
    async signIn(login) { const u = users.find(x => x.login === login.trim().toLowerCase()); if (!u) throw { code: "auth/invalid-credential" }; current = { uid: u.uid, login: u.login, isAdmin: u.login === ADMIN_LOGIN }; authCb(current); },
    async createAdmin() { return api.signIn(ADMIN_LOGIN); },
    async signOut() { current = null; authCb(null); },
    async changePassword() {},
    watchUsers(cb) { const f = () => cb(users.map(u => ({ ...u }))); L.add(f); f(); return () => L.delete(f); },
    async createUser(login, name) { users.push({ uid: "u" + (n++ + 10), login: login.trim().toLowerCase(), name, role: "member" }); emit(); },
    async removeUser(uid) { const i = users.findIndex(u => u.uid === uid); if (i >= 0) users.splice(i, 1); emit(); },
    watchTasks(cb) { const f = () => cb(tasks.map(t => ({ ...t }))); L.add(f); f(); return () => L.delete(f); },
    async addTask(t) { tasks.push({ id: "t" + n++, ...t, history: [{ at: Date.now(), by: current.uid, text: "Создал(а) задачу" }], createdAt: Date.now(), updatedAt: Date.now() }); emit(); },
    async updateTask(id, p, log) { const t = tasks.find(t => t.id === id); Object.assign(t, p, { updatedAt: Date.now() }); if (log) (t.history ||= []).push({ at: Date.now(), by: current.uid, text: log }); emit(); },
    async removeTask(id) { tasks.splice(tasks.findIndex(t => t.id === id), 1); emit(); },
    watchReports(id, cb) { const f = () => cb((reports[id] || []).slice()); L.add(f); f(); return () => L.delete(f); },
    async addReport(id, text) { (reports[id] ||= []).push({ id: "r" + n++, author: current.uid, text, createdAt: Date.now() }); const t = tasks.find(x => x.id === id); if (t) t.lastReport = Date.now(); emit(); },
    watchKpi(cb) { const f = () => cb(kpi.map(k => ({ ...k }))); L.add(f); f(); return () => L.delete(f); },
    async saveKpi(id, data) { const k = kpi.find(x => x.id === id); if (k) Object.assign(k, data); else kpi.push({ id, ...data }); emit(); },
    async removeKpi(id) { kpi.splice(kpi.findIndex(k => k.id === id), 1); emit(); },
    watchPoints(cb) { const f = () => cb(pts.map(k => ({ ...k }))); L.add(f); f(); return () => L.delete(f); },
    async addPoints(p) { pts.push({ id: "p" + n++, ...p, by: current.uid, at: Date.now() }); emit(); },
    async removePoints(id) { pts.splice(pts.findIndex(k => k.id === id), 1); emit(); },
  };
  return api;
}

/* ===================== APP ===================== */
let B, ME = null, USERS = [], TASKS = [], KPI = [], POINTS = [];
let VIEW = "mine", FILTER = "open", BOARD_SCOPE = "mine", unsub = [];

const userName = uid => USERS.find(u => u.uid === uid)?.name || "—";
const uidByLogin = l => USERS.find(u => u.login === l)?.uid;
const initials = name => (name || "?").trim()[0]?.toUpperCase() || "?";

function isOverdue(t) { return t.status !== "done" && t.status !== "review" && t.deadline && t.deadline < todayStr(); }
const PEOPLE = () => USERS.filter(u => u.role !== "bot");
/* кто принимает результат: админ или постановщик */
function canAccept(t) { return ME.isAdmin || t.createdBy === ME.uid; }
/* «новые» задачи — пока исполнитель их не открыл (хранится в этом браузере) */
const seenKey = () => "fi_seen_" + ME.uid;
function seenSet() { try { return new Set(JSON.parse(localStorage.getItem(seenKey()) || "[]")); } catch { return new Set(); } }
function markSeen(id) { try { const s = seenSet(); if (!s.has(id)) { s.add(id); localStorage.setItem(seenKey(), JSON.stringify([...s].slice(-500))); } } catch {} }
function isNew(t) { return t.status !== "done" && (t.assignees || []).includes(ME.uid) && t.createdBy !== ME.uid && !seenSet().has(t.id); }
function decisionsFor() { return TASKS.filter(t => (t.status === "review" && t.createdBy === ME.uid && !(t.assignees || []).every(a => a === ME.uid)) || (t.status !== "done" && t.extension?.status === "pending" && canDecide(t))); }
function myBadge() { const ids = new Set(); TASKS.forEach(t => { if ((t.assignees || []).includes(ME.uid) && (isNew(t) || isOverdue(t))) ids.add(t.id); }); decisionsFor().forEach(t => ids.add(t.id)); return ids.size; }
function addDays(iso, rep) { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d); if (rep === "day") dt.setDate(dt.getDate() + 1); else if (rep === "week") dt.setDate(dt.getDate() + 7); else if (rep === "month") dt.setMonth(dt.getMonth() + 1); return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`; }
function chkProgress(t) { const c = t.checklist || []; return c.length ? { done: c.filter(x => x.done).length, all: c.length } : null; }
function canEdit(t) { return ME.isAdmin || (t.assignees || []).includes(ME.uid) || t.createdBy === ME.uid; }
/* кто может менять и удалять задачу: админ или тот, кто её поставил */
function canManage(t) { return ME.isAdmin || t.createdBy === ME.uid; }
/* кто решает по переносу срока: админ или постановщик (если он сам не исполнитель) */
function canDecide(t) { return ME.isAdmin || (t.createdBy === ME.uid && !(t.assignees || []).includes(ME.uid)); }

/* ===================== БАЛЛЫ =====================
   +10 — задача сделана в срок
   +5  — сделана с опозданием или задача без срока
   −5  — за каждый день просрочки (не больше −30 за одну задачу)
   Если до или во время просрочки попросить перенос — пока ждёт решения, минусы не идут.
   Одобрили — новый срок (дни, что уже были просрочены до запроса, остаются).
   Отклонили — минусы считаются от старого срока.
   Задачи, которые человек поставил сам себе, баллов не дают (кроме админа). */
const PTS = { onTime: 10, late: 5, noDeadline: 5, perDay: 5, maxDays: 6 };
const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const isoOf = ms => { const d = new Date(ms); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const isAdminUid = uid => USERS.find(u => u.uid === uid)?.role === "admin";
function countsForPoints(t, uid) { return !!t.createdBy && (t.createdBy !== uid || isAdminUid(t.createdBy)); }
function overDays(t) {
  if (!t.deadline) return 0;
  let end = t.status === "done" ? (t.doneAt || todayStr()) : t.status === "review" ? (t.submittedAt || todayStr()) : todayStr();
  const e = t.extension;
  if (e && e.status === "pending") { const r = isoOf(e.at); if (r < end) end = r; }
  return Math.max(0, dayDiff(t.deadline, end));
}
function taskDelta(t, uid) {
  if (!countsForPoints(t, uid)) return 0;
  const days = Math.min(PTS.maxDays, (t.carryDays || 0) + overDays(t));
  let base = 0;
  if (t.status === "done") base = !t.deadline ? PTS.noDeadline : days === 0 ? PTS.onTime : PTS.late;
  return base - days * PTS.perDay;
}
function scoreOf(uid) {
  const fromTasks = TASKS.filter(t => (t.assignees || []).includes(uid)).reduce((s, t) => s + taskDelta(t, uid), 0);
  const manual = POINTS.filter(p => p.uid === uid).reduce((s, p) => s + (+p.delta || 0), 0);
  return fromTasks + manual;
}
const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v);
function pointsChip(t) {
  const who = (t.assignees || []).includes(ME.uid) ? ME.uid : (t.assignees || [])[0];
  if (!who || !countsForPoints(t, who)) return "";
  const v = taskDelta(t, who); if (!v) return "";
  return `<span class="chip ${v < 0 ? "over" : "st-done"}">${signed(v)} балл.</span>`;
}
function extChip(t) {
  const e = t.extension; if (!e || e.status !== "pending" || t.status === "done") return "";
  return `<span class="chip today">просит перенос на ${fmtDate(e.newDeadline)}</span>`;
}

function deadlineChip(t) {
  if (!t.deadline) return `<span class="chip">без срока</span>`;
  if (isOverdue(t)) return `<span class="chip over">просрочено · ${fmtDate(t.deadline)}</span>`;
  if (t.deadline === todayStr() && t.status !== "done") return `<span class="chip today">сегодня</span>`;
  return `<span class="chip">до ${fmtDate(t.deadline)}</span>`;
}
function statusChip(t) { const s = t.status || "todo"; return `<span class="chip st-${s}">${STATUS[s]}</span>`; }

function extraChips(t) {
  const c = chkProgress(t);
  return `${isNew(t) ? `<span class="chip new">новая</span>` : ""}${t.urgent && t.status !== "done" ? `<span class="chip urgent">🔥 срочно</span>` : ""}${c ? `<span class="chip">☑ ${c.done}/${c.all}</span>` : ""}${t.repeat ? `<span class="chip">🔁 ${REPEAT[t.repeat]}</span>` : ""}`;
}
function taskCard(t, showWho = true) {
  const who = (t.assignees || []).map(userName).join(", ");
  return `<div class="card task ${t.status === "done" ? "done" : ""} ${t.urgent && t.status !== "done" ? "urgent" : ""}" data-task="${t.id}">
    <div class="top"><div class="title">${esc(t.title)}</div></div>
    <div class="chips">${extraChips(t)}${statusChip(t)}${deadlineChip(t)}${extChip(t)}${pointsChip(t)}${showWho ? `<span class="chip">${esc(who)}</span>` : ""}${t.lastReport ? `<span class="chip">отчёт ${fmtTime(t.lastReport)}</span>` : ""}</div>
  </div>`;
}

function sortTasks(list) {
  const rank = t => t.status === "done" ? 4 : t.urgent ? 0 : isOverdue(t) ? 1 : t.deadline ? 2 : 3;
  return list.slice().sort((a, b) => rank(a) - rank(b) || (a.deadline || "9").localeCompare(b.deadline || "9") || (a.createdAt || 0) - (b.createdAt || 0));
}
function applyFilter(list) {
  if (FILTER === "open") return list.filter(t => t.status !== "done");
  if (FILTER === "over") return list.filter(isOverdue);
  if (FILTER === "done") return list.filter(t => t.status === "done");

}
function filtersHtml(withByMe) {

  if (withByMe) f.push(["byme", "Поставил(а) я"]);
  return `<div class="filters">${f.map(([k, l]) => `<button data-filter="${k}" class="${FILTER === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
}

/* ---------- views ---------- */

  const open = mine.filter(t => t.status !== "done").length, over = mine.filter(isOverdue).length;

  const byMe = TASKS.filter(t => t.createdBy === ME.uid && !(t.assignees || []).every(a => a === ME.uid));

    <div class="stat"><div class="card"><b>${total - done}</b><span class="small muted">в работе</span></div>

  if (ME.isAdmin && TASKS.length === 0) html += `<div class="card"><div class="small muted">Задач пока нет. Можно сразу загрузить задачи недели 2–8 ноября, которые ты выложил в группу.</div><div style="margin-top:10px"><button class="btn sec" data-act="seed">Загрузить задачи недели 2–8.11</button></div></div>`;

function svgChart(points, color = "#4A0D12") {
  const W = 300, H = 120, P = 26;
  if (!points.length) return `<div class="small muted">Нет данных</div>`;
  const max = Math.max(...points.map(p => p.v), 1);
  const bw = Math.min(36, (W - P) / points.length - 8);
  const bars = points.map((p, i) => {
    const x = P + i * ((W - P) / points.length) + 4; const h = Math.round((p.v / max) * (H - 34)); const y = H - 18 - h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${p.base ? "#c9b3b0" : color}"/>
      <text x="${x + bw / 2}" y="${y - 4}" font-size="9" text-anchor="middle" fill="#2b1416">${fmtNum(p.v)}</text>
      <text x="${x + bw / 2}" y="${H - 5}" font-size="9" text-anchor="middle" fill="#8a6f72">${esc(p.l)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${bars}</svg>`;
}

function kpiRows() { return KPI.slice().sort((a, b) => (a.base ? -1 : b.base ? 1 : a.id.localeCompare(b.id))); }
function onTimePct(weekId) {
  if (weekId.startsWith("base")) return null;
  const start = weekId; const endD = new Date(weekId); endD.setDate(endD.getDate() + 6); const end = endD.toISOString().slice(0, 10);
  const due = TASKS.filter(t => t.deadline && t.deadline >= start && t.deadline <= end);
  if (!due.length) return null;
  const ok = due.filter(t => t.status === "done" && (!t.doneAt || t.doneAt <= t.deadline)).length;
  return Math.round(ok / due.length * 100);
}
function weekLabel(k, short) { if (k.base) return short ? "октябрь" : (k.label || "база"); const [, m, d] = k.id.split("-"); return `${d}.${m}`; }

function viewKpi() {
  const rows = kpiRows();
  const charts = [["orders", "Заказы, шт"], ["revenue", "Выручка, сум"], ["grud", "Нагрудники, шт"], ["reach", "Просмотры рилсов"]]
    .map(([k, l]) => `<div class="card"><h4>${l}</h4>${svgChart(rows.filter(r => r[k] != null).slice(-8).map(r => ({ l: weekLabel(r, true), v: +r[k], base: r.base, l2: 1 })))}</div>`).join("");
  const head = `<tr><th>Неделя</th>${KPI_FIELDS.map(f => `<th>${f.label}</th>`).join("")}<th>Задачи вовремя</th></tr>`;

    return `<tr ${ME.isAdmin ? `data-kpi="${r.id}" style="cursor:pointer"` : ""}><td>${r.base ? `<b>${esc(weekLabel(r))}</b>` : "нед. с " + weekLabel(r)}</td>${KPI_FIELDS.map(f => `<td>${fmtNum(r[f.key])}</td>`).join("")}<td>${pct == null ? "—" : pct + "%"}</td></tr>`;
  }).join("");
  return `<div class="row"><h2 class="grow">KPI</h2>${ME.isAdmin ? `<button class="btn" data-act="new-kpi">+ Неделя</button>` : ""}</div>
    <div class="small muted" style="margin:0 4px 10px">Цифры вносятся раз в неделю. Серый столбик — точка отсчёта (октябрь). «Задачи вовремя» считается сам по задачам со сроком на этой неделе.</div>
    ${ME.isAdmin && !KPI.some(k => k.base) ? `<div class="card"><div class="small muted">Добавить октябрь как точку отсчёта: 14 заказов, 4 562 000 сум, 1 нагрудник.</div><div style="margin-top:10px"><button class="btn sec" data-act="seed-kpi">Добавить октябрь</button></div></div>` : ""}
    <div class="charts">${charts}</div>
    <div class="card tablewrap" style="margin-top:10px"><table>${head}${body || `<tr><td colspan="11" class="muted">Пока нет данных</td></tr>`}</table></div>`;

/* ---------- канбан-доска ---------- */
function viewBoard() {
  const base = BOARD_SCOPE === "mine" ? TASKS.filter(t => (t.assignees || []).includes(ME.uid) || t.createdBy === ME.uid) : TASKS;
  const weekAgo = isoOf(Date.now() - 14 * 864e5);
  const cols = [["todo", "Не начато"], ["doing", "В работе"], ["review", "На проверке"], ["done", "Готово"]];
  const order = cols.map(c => c[0]);
  const colHtml = ([k, l]) => {
    let list = base.filter(t => (t.status || "todo") === k);
    if (k === "done") list = list.filter(t => (t.doneAt || "") >= weekAgo);
    list = sortTasks(list);
    return `<div class="col" data-col="${k}"><h3><span>${l}</span><span class="muted">${list.length}</span></h3>
      ${list.map(t => {
        const i = order.indexOf(k); const can = canEdit(t);
        const prev = can && i > 0 && k !== "done" ? order[i - 1] : null;
        let next = can && i < 3 ? order[i + 1] : null;
        if (k === "review" && !canAccept(t)) next = null;
        if (k === "review" && prev && !canAccept(t)) { /* исполнитель не двигает из проверки */ }
        const prevOk = prev && !(k === "review" && !canAccept(t));
        return `<div class="card task ${t.status === "done" ? "done" : ""} ${t.urgent && t.status !== "done" ? "urgent" : ""}" data-task="${t.id}" draggable="${can}">
          <div class="title">${esc(t.title)}</div>
          <div class="chips" style="margin-top:6px">${extraChips(t)}${deadlineChip(t)}${extChip(t)}<span class="chip">${esc((t.assignees || []).map(userName).join(", "))}</span></div>
          ${prevOk || next ? `<div class="mv">${prevOk ? `<button data-move="${prev}" data-id="${t.id}">←</button>` : "<span></span>"}${next ? `<button data-move="${next}" data-id="${t.id}">→</button>` : ""}</div>` : ""}
        </div>`;
      }).join("") || `<div class="small muted" style="padding:10px 6px">пусто</div>`}</div>`;
  };
  return `<div class="row"><h2 class="grow">Доска</h2><button class="btn" data-act="new-task">+ Задача</button></div>
    <div class="filters"><button data-scope="mine" class="${BOARD_SCOPE === "mine" ? "on" : ""}">Мои</button><button data-scope="all" class="${BOARD_SCOPE === "all" ? "on" : ""}">Все</button></div>
    <div class="board">${cols.map(colHtml).join("")}</div>
    <div class="small muted" style="margin:4px">Карточки двигаются стрелками ← → или перетаскиванием (на компьютере). «Готово» у чужой задачи отправляет её на проверку постановщику.</div>`;
}
function bindBoardDnD() {
  document.querySelectorAll(".board .task[draggable=true]").forEach(c => c.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", c.dataset.task)));
  document.querySelectorAll(".board .col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("drop"); });
    col.addEventListener("dragleave", () => col.classList.remove("drop"));
    col.addEventListener("drop", async e => {
      e.preventDefault(); col.classList.remove("drop");
      const t = TASKS.find(x => x.id === e.dataTransfer.getData("text/plain")); const to = col.dataset.col;
      if (!t || (t.status || "todo") === to) return;
      if (t.status === "review" && !canAccept(t)) return toast("Задача на проверке у постановщика");
      try { await setStatus(t, to); } catch (err) { toast("Ошибка: " + (err?.code || err)); }
    });
  });
}

/* ---------- отчёт Лазизу ---------- */
function buildReport() {
  const today = todayStr(), mon = mondayOf(today);
  const pf = iso => { const [, m, d] = iso.split("-"); return `${d}.${m}`; };
  const names = t => (t.assignees || []).map(userName).join(", ");
  const done = TASKS.filter(t => t.status === "done" && (t.doneAt || "") >= mon);
  const open = TASKS.filter(t => t.status !== "done");
  const bad = open.filter(t => isOverdue(t) || t.extension?.status === "pending");
  const good = open.filter(t => !bad.includes(t));
  const line = t => {
    let x = `• ${t.title} — ${names(t)}`;
    if (t.status === "review") x += " (на проверке)";
    else if (t.extension?.status === "pending") x += ` (просит перенос на ${fmtDate(t.extension.newDeadline)})`;
    if (isOverdue(t)) x += `, просрочено с ${fmtDate(t.deadline)}`; else if (t.deadline && t.status !== "review") x += `, до ${fmtDate(t.deadline)}`;
    return x;
  };
  const out = [`Отчёт Feel It за неделю ${pf(mon)}–${pf(today)}`, ""];
  out.push(`✅ Сделано (${done.length}):`); out.push(...(done.length ? done.map(t => `• ${t.title} — ${names(t)}`) : ["• пока ничего"])); out.push("");
  out.push(`🟢 Идёт по плану (${good.length}):`); out.push(...(good.length ? sortTasks(good).map(line) : ["• —"])); out.push("");
  out.push(`🔴 Не по плану (${bad.length}):`); out.push(...(bad.length ? sortTasks(bad).map(line) : ["• всё в срок 👌"])); out.push("");
  const k = kpiRows().filter(r => !r.base).slice(-1)[0];
  if (k) { out.push(`📊 Цифры (неделя с ${weekLabel(k)}):`); KPI_FIELDS.forEach(f => { if (k[f.key] != null) out.push(`• ${f.label}: ${fmtNum(k[f.key])}`); }); out.push(""); }
  out.push("🏆 Баллы:"); PEOPLE().map(u => [u.name, scoreOf(u.uid)]).sort((a, b) => b[1] - a[1]).forEach(([n, v]) => out.push(`• ${n}: ${signed(v) || 0}`));
  return out.join("\n");
}
function sheetReport() {

function viewRating() {
  const rows = PEOPLE().map(u => {
    const mine = TASKS.filter(t => (t.assignees || []).includes(u.uid) && countsForPoints(t, u.uid));
    const onTime = mine.filter(t => t.status === "done" && taskDelta(t, u.uid) === PTS.onTime).length;
    const late = mine.filter(t => (t.carryDays || 0) + overDays(t) > 0).length;
    const manual = POINTS.filter(p => p.uid === u.uid).reduce((s, p) => s + (+p.delta || 0), 0);
    return { u, score: scoreOf(u.uid), onTime, late, manual };
  }).sort((a, b) => b.score - a.score || a.u.name.localeCompare(b.u.name));
  const log = POINTS.slice().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 20);
  return `<h2>Рейтинг</h2>
    ${rows.map((r, i) => `<div class="card row"><span class="avatar">${i + 1}</span><div class="grow"><b>${esc(r.u.name)}</b>
      <div class="chips" style="margin-top:6px"><span class="chip st-done">в срок ${r.onTime}</span><span class="chip ${r.late ? "over" : ""}">с просрочкой ${r.late}</span>${r.manual ? `<span class="chip">вручную ${signed(r.manual)}</span>` : ""}</div></div>
      <b style="font-size:22px;color:${r.score < 0 ? "var(--bad)" : "var(--burg)"}">${signed(r.score) || 0}</b>
      ${ME.isAdmin ? `<button class="btn ghost small" data-adjpts="${r.u.uid}">±</button>` : ""}</div>`).join("") || `<div class="empty">Пока никого</div>`}
    <div class="card small"><b>Как считаются баллы</b>
      <div style="margin-top:6px;line-height:1.6">✅ Сделал(а) в срок: <b>+${PTS.onTime}</b><br>🕓 Сделал(а) с опозданием или задача без срока: <b>+${PTS.late}</b><br>⛔ Каждый день просрочки: <b>−${PTS.perDay}</b> (не больше −${PTS.perDay * PTS.maxDays} за задачу)<br>
      🙋 Не успеваешь — открой задачу и нажми «Попросить перенос». Пока постановщик решает, минусы не идут. Одобрили — у задачи новый срок. Отклонили — минусы считаются от старого срока.<br>
      Задачи, которые ставишь сам(а) себе, баллов не дают. Админ может добавить или снять баллы вручную с причиной.</div></div>
    ${log.length ? `<div class="person">Баллы вручную</div>${log.map(p => `<div class="card small row"><div class="grow"><b>${esc(userName(p.uid))}</b> · ${signed(+p.delta)} · ${esc(p.reason || "")}<div class="muted">${esc(userName(p.by))} · ${fmtTime(p.at)}</div></div>${ME.isAdmin ? `<button class="btn ghost small" data-delpts="${p.id}">✕</button>` : ""}</div>`).join("")}` : ""}`;
}

function sheetTask(id) {

  const who = (t.assignees || []).map(userName).join(", ");
  const editable = canEdit(t);
  const isAssignee = (t.assignees || []).includes(ME.uid);
  const e = t.extension;
  let extHtml = "";
  if (e && e.status === "pending" && t.status !== "done") {
    extHtml = `<div class="card" style="background:#fdf0dd;border-color:#f0d9b5;margin-top:10px"><b>${esc(userName(e.by))} просит перенести срок на ${fmtDate(e.newDeadline)}</b>

      ${canDecide(t) ? `<div class="row" style="margin-top:10px"><button class="btn" data-approve="${t.id}">Одобрить</button><button class="btn danger" data-reject="${t.id}">Отклонить</button></div>` : ""}</div>`;
  } else if (e && e.status !== "pending") {
    extHtml = `<div class="small muted" style="margin-top:8px">Перенос на ${fmtDate(e.newDeadline)} ${e.status === "approved" ? "одобрен" : "отклонён"} (${esc(userName(e.decidedBy))}, ${fmtTime(e.decidedAt)})${t.origDeadline ? ` · первый срок был ${fmtDate(t.origDeadline)}` : ""}</div>`;
  }
  if (isAssignee && t.status !== "done" && t.status !== "review" && t.deadline && !(e && e.status === "pending")) {
    extHtml += `<div style="margin-top:10px"><button class="btn ghost" data-askext="${t.id}">Попросить перенос срока</button></div>
      <div id="ext-form" class="hidden"><label>Новый срок</label><input id="ext-date" type="date" min="${todayStr()}">

  }
  // статус
  let statusHtml = "";
  if (editable && t.status !== "done" && t.status !== "review") {
    const btns = [["todo", "Не начато"], ["doing", "В работе"], ["done", canAccept(t) ? "Готово" : "Сдать на проверку"]];

  openSheet(`<div class="row"><h2 class="grow" style="margin:0">${esc(t.title)}</h2><button class="btn ghost" data-close>✕</button></div>
    <div class="chips" style="margin:8px 0">${t.urgent && t.status !== "done" ? `<span class="chip urgent">🔥 срочно</span>` : ""}${statusChip(t)}${deadlineChip(t)}${extChip(t)}<span class="chip">${esc(who)}</span>${t.repeat ? `<span class="chip">🔁 ${REPEAT[t.repeat]}</span>` : ""}</div>

    <textarea id="rtext" placeholder="Что сделано, что мешает, что дальше"></textarea>
    <div style="margin-top:8px"><button class="btn" data-addreport="${t.id}">Отправить</button></div>
    ${hist.length ? `<details><summary>История изменений (${hist.length})</summary>${hist.map(h => `<div class="hist"><span class="muted">${fmtTime(h.at)} · ${esc(userName(h.by))}:</span> ${esc(h.text)}</div>`).join("")}</details>` : ""}
    ${canManage(t) ? `<div class="row" style="margin-top:18px"><button class="btn sec" data-edittask="${t.id}">Изменить</button><button class="btn danger" data-deltask="${t.id}">Удалить</button></div>` : ""}`);
  reportUnsub = B.watchReports(id, list => {
    const el = $("#reports"); if (!el) return;
    el.classList.remove("muted");
    el.innerHTML = list.length ? list.map(r => `<div class="report"><div class="meta">${esc(userName(r.author))} · ${fmtTime(r.createdAt)}</div><div style="white-space:pre-wrap">${esc(r.text)}</div></div>`).join("") : `<span class="muted">Пока пусто</span>`;
  });
}

    $("#l-go").disabled = true; $("#l-err").textContent = "";

      const code = e?.code || "";

      else $("#l-err").textContent = "Неверный логин или пароль";
      if (login.toLowerCase() === ADMIN_LOGIN && (code.includes("invalid-credential") || code.includes("user-not-found"))) $("#l-admin").classList.remove("hidden");
    }
  };
  $("#l-go").onclick = go;
  $("#l-pass").onkeydown = e => { if (e.key === "Enter") go(); };

/* смена статуса: исполнитель сдаёт на проверку, постановщик принимает */
async function setStatus(t, s) {
  if (s === "done" && !canAccept(t)) s = "review";
  if (s === "review") { await B.updateTask(t.id, { status: "review", submittedAt: todayStr() }, "Сдал(а) на проверку"); toast("Отправлено на проверку"); return; }
  if (s === "done") {
    const doneAt = t.status === "review" ? (t.submittedAt || todayStr()) : todayStr();
    await B.updateTask(t.id, { status: "done", doneAt }, t.status === "review" ? "Принял(а) результат" : "Завершил(а) задачу");
    if (t.repeat && t.deadline && !t.repeatSpawned) {
      let nd = addDays(t.deadline, t.repeat); while (nd < todayStr()) nd = addDays(nd, t.repeat);
      await B.addTask({ title: t.title, desc: t.desc || "", deadline: nd, assignees: t.assignees || [], urgent: !!t.urgent, repeat: t.repeat, checklist: (t.checklist || []).map(x => ({ text: x.text, done: false })), status: "todo", createdBy: t.createdBy || ME.uid });
      await B.updateTask(t.id, { repeatSpawned: true });
      toast("Готово · следующая на " + fmtDate(nd)); return;
    }
    toast("Задача завершена"); return;
  }
  await B.updateTask(t.id, { status: s, doneAt: null, submittedAt: null }, "Статус: " + STATUS[s]); toast("Статус обновлён");
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-view],[data-filter],[data-task],[data-act],[data-close],[data-status],[data-addreport],[data-edittask],[data-deltask],[data-savetask],[data-kpi],[data-savekpi],[data-delkpi],[data-saveuser],[data-rmuser],[data-savepass],[data-askext],[data-sendext],[data-approve],[data-reject],[data-adjpts],[data-savepts],[data-delpts],[data-accept],[data-return],[data-sendreturn],[data-chk],[data-chkdel],[data-chkadd],[data-move],[data-scope],[data-act]");
  if (!el) { if (e.target.id === "sheet") closeSheet(); return; }
  const d = el.dataset;
  try {
    if (d.view) { VIEW = d.view; renderMain(); window.scrollTo(0, 0); }
    else if (d.filter) { FILTER = d.filter; renderMain(); }
    else if (d.task) sheetTask(d.task);
    else if ("close" in d) closeSheet();
    else if (d.act === "new-task") sheetTaskForm();
    else if (d.act === "report") sheetReport();
    else if (d.act === "copy-report") { const v = $("#rep-text").value; try { await navigator.clipboard.writeText(v); } catch { $("#rep-text").select(); document.execCommand("copy"); } toast("Скопировано — вставь в Telegram"); }
    else if (d.scope) { BOARD_SCOPE = d.scope; renderMain(); }
    else if (d.move) { e.stopPropagation(); const t = TASKS.find(x => x.id === d.id); await setStatus(t, d.move); }
    else if (d.act === "new-kpi") sheetKpi();
    else if (d.act === "new-user") sheetUser();
    else if (d.act === "change-pass") sheetPass();
    else if (d.act === "seed-kpi") { await B.saveKpi("base-2026-10", { base: true, label: "Октябрь 2026 (4–29.10)", orders: 14, revenue: 4562000, grud: 1 }); toast("Октябрь добавлен"); }
    else if (d.act === "seed") {
      const missing = [...new Set(WEEK_TASKS.flatMap(t => t.who))].filter(l => !uidByLogin(l));
      if (missing.length && !confirm(`Нет входов для: ${missing.join(", ")}. Их задачи загрузятся без исполнителя. Продолжить?`)) return;
      for (const t of WEEK_TASKS) await B.addTask({ title: t.title, desc: t.desc, deadline: t.deadline, status: "todo", assignees: t.who.map(uidByLogin).filter(Boolean), createdBy: ME.uid });
      toast("Задачи недели загружены");
    }
    else if (d.status) { await setStatus(TASKS.find(x => x.id === d.id), d.status); closeSheet(); }
    else if (d.accept) { await setStatus(TASKS.find(x => x.id === d.accept), "done"); closeSheet(); }
    else if (d.return) { $("#ret-form").classList.remove("hidden"); el.classList.add("hidden"); }
    else if (d.sendreturn) {
      const why = $("#ret-reason").value.trim(); if (!why) { $("#ret-err").textContent = "Напишите, что доделать"; return; }
      await B.updateTask(d.sendreturn, { status: "doing", submittedAt: null }, "Вернул(а) на доработку: " + why);
      await B.addReport(d.sendreturn, "↩️ Вернул(а) на доработку: " + why); closeSheet(); toast("Задача возвращена");
    }
    else if (d.chk) {
      const t = TASKS.find(x => x.id === d.id); const c = (t.checklist || []).map(x => ({ ...x })); c[+d.chk].done = el.checked;
      await B.updateTask(t.id, { checklist: c }); sheetTask(t.id);
    }
    else if (d.chkdel) {
      const t = TASKS.find(x => x.id === d.id); const c = (t.checklist || []).filter((_, i) => i !== +d.chkdel);
      await B.updateTask(t.id, { checklist: c }); sheetTask(t.id);
    }
    else if (d.chkadd) {
      const v = $("#chk-new").value.trim(); if (!v) return; const t = TASKS.find(x => x.id === d.chkadd);
      await B.updateTask(t.id, { checklist: [...(t.checklist || []), { text: v, done: false }] }, "Добавил(а) пункт: " + v); sheetTask(t.id);
    }
    else if (d.addreport) {
      const text = $("#rtext").value.trim(); if (!text) return;
      el.disabled = true; await B.addReport(d.addreport, text); $("#rtext").value = ""; el.disabled = false; toast("Отчёт отправлен");
    }
    else if (d.edittask) { const t = TASKS.find(x => x.id === d.edittask); closeSheet(); sheetTaskForm(t); }
    else if (d.deltask) { if (confirm("Удалить задачу?")) { await B.removeTask(d.deltask); closeSheet(); } }
    else if ("savetask" in d) {
      const title = $("#f-title").value.trim();
      const assignees = [...document.querySelectorAll("#f-who input:checked")].map(i => i.value);
      if (!title) { $("#f-err").textContent = "Напишите задачу"; return; }
      if (!assignees.length) { $("#f-err").textContent = "Выберите, кто делает"; return; }
      const data = { title, desc: $("#f-desc").value.trim(), deadline: $("#f-deadline").value, assignees, urgent: $("#f-urgent").checked, repeat: $("#f-repeat").value };
      if (data.repeat && !data.deadline) { $("#f-err").textContent = "Для повторяющейся задачи нужен срок"; return; }
      if (d.savetask) {
        const old = TASKS.find(x => x.id === d.savetask); const ch = [];
        if (old.deadline !== data.deadline) ch.push(`срок ${old.deadline ? fmtDate(old.deadline) : "—"} → ${data.deadline ? fmtDate(data.deadline) : "без срока"}`);
        if ((old.assignees || []).join() !== assignees.join()) ch.push("исполнители: " + assignees.map(userName).join(", "));
        if (old.title !== title) ch.push("название"); if (!!old.urgent !== data.urgent) ch.push(data.urgent ? "срочно" : "не срочно");
        await B.updateTask(d.savetask, data, "Изменил(а): " + (ch.join("; ") || "описание"));
      } else {
        const checklist = ($("#f-chk")?.value || "").split("\n").map(x => x.trim()).filter(Boolean).map(text => ({ text, done: false }));
        await B.addTask({ ...data, checklist, status: "todo", createdBy: ME.uid });
      }
      closeSheet(); toast(d.savetask ? "Сохранено" : "Задача создана");
    }
    else if (d.askext) { $("#ext-form").classList.remove("hidden"); el.classList.add("hidden"); }
    else if (d.sendext) {
      const t = TASKS.find(x => x.id === d.sendext); const nd = $("#ext-date").value, reason = $("#ext-reason").value.trim();
      if (!nd || nd <= t.deadline) { $("#ext-err").textContent = "Выберите дату позже текущего срока"; return; }
      if (!reason) { $("#ext-err").textContent = "Напишите причину"; return; }
      el.disabled = true;
      await B.updateTask(t.id, { extension: { by: ME.uid, newDeadline: nd, reason, at: Date.now(), status: "pending" } }, `Попросил(а) перенос на ${fmtDate(nd)}`);
      await B.addReport(t.id, `🙋 Прошу перенести срок с ${fmtDate(t.deadline)} на ${fmtDate(nd)}. Причина: ${reason}`);
      closeSheet(); toast("Запрос отправлен");
    }
    else if (d.approve || d.reject) {
      const t = TASKS.find(x => x.id === (d.approve || d.reject)); const e2 = t.extension; const ok = !!d.approve;
      const patch = { extension: { ...e2, status: ok ? "approved" : "rejected", decidedBy: ME.uid, decidedAt: Date.now() } };
      if (ok) { patch.origDeadline = t.origDeadline || t.deadline; patch.carryDays = (t.carryDays || 0) + Math.max(0, dayDiff(t.deadline, isoOf(e2.at))); patch.deadline = e2.newDeadline; }
      await B.updateTask(t.id, patch, ok ? `Одобрил(а) перенос на ${fmtDate(e2.newDeadline)}` : "Отклонил(а) перенос");
      await B.addReport(t.id, ok ? `✅ Перенос одобрен: новый срок ${fmtDate(e2.newDeadline)}` : `❌ Перенос отклонён, срок остаётся ${fmtDate(t.deadline)}`);
      closeSheet(); toast(ok ? "Перенос одобрен" : "Перенос отклонён");
    }
    else if (d.adjpts) sheetPoints(d.adjpts);
    else if (d.savepts) {
      const v = parseInt($("#pt-delta").value.replace("−", "-"), 10), reason = $("#pt-reason").value.trim();
      if (!v) { $("#pt-err").textContent = "Введите число, например 10 или -10"; return; }
      if (!reason) { $("#pt-err").textContent = "Напишите, за что"; return; }
      await B.addPoints({ uid: d.savepts, delta: v, reason }); closeSheet(); toast("Баллы сохранены");
    }
    else if (d.delpts) { if (confirm("Удалить эту запись?")) await B.removePoints(d.delpts); }
    else if (d.kpi) sheetKpi(d.kpi);
    else if ("savekpi" in d) {
      const data = {}; KPI_FIELDS.forEach(f => data[f.key] = num($("#k-" + f.key).value)); data.note = $("#k-note").value.trim();
      let id = d.savekpi;
      if (!id || !id.startsWith("base")) { const w = $("#k-week").value; if (!w) return; const nid = mondayOf(w); if (id && id !== nid) await B.removeKpi(id); id = nid; }
      await B.saveKpi(id, data); closeSheet(); toast("Цифры сохранены");
    }
    else if (d.delkpi) { if (confirm("Удалить эту неделю?")) { await B.removeKpi(d.delkpi); closeSheet(); } }
    else if ("saveuser" in d) {
      const name = $("#u-name").value.trim(), login = $("#u-login").value.trim().toLowerCase(), pass = $("#u-pass").value;
      if (!name || !/^[a-z0-9._-]{2,}$/.test(login)) { $("#u-err").textContent = "Имя и логин латиницей, без пробелов"; return; }
      if (pass.length < 6) { $("#u-err").textContent = "Пароль минимум 6 символов"; return; }
      if (USERS.some(u => u.login === login)) { $("#u-err").textContent = "Такой логин уже есть"; return; }
      el.disabled = true;
      try { await B.createUser(login, name, pass); closeSheet(); toast(`Вход создан: ${login}`); }
      catch (err) { el.disabled = false; $("#u-err").textContent = (err?.code || "").includes("email-already") ? "Такой логин уже занят" : "Не получилось: " + (err?.code || err); }
    }
    else if (d.rmuser) { if (confirm("Убрать участника из команды? Его вход перестанет открывать сайт.")) await B.removeUser(d.rmuser); }
    else if ("savepass" in d) {
      const o = $("#p-old").value, n = $("#p-new").value;
      if (n.length < 6) { $("#p-err").textContent = "Минимум 6 символов"; return; }
      try { await B.changePassword(o, n); closeSheet(); toast("Пароль изменён"); } catch { $("#p-err").textContent = "Текущий пароль неверный"; }
    }
  } catch (err) { console.error(err); toast("Ошибка: " + (err?.code || err?.message || err)); }
});

/* ---------- start ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
(async () => {
  if (DEMO) $("#banner").classList.remove("hidden");
  try { B = DEMO ? demoBackend() : await firebaseBackend(); }
  catch (e) { $("#app").innerHTML = `<div class="empty">Не удалось подключиться к Firebase. Проверьте настройки.</div>`; console.error(e); return; }
  B.onAuth(user => {
    unsub.forEach(f => f && f()); unsub = []; closeSheet();
    ME = user; VIEW = "mine"; FILTER = "open";
    if (!user) return renderLogin();
    renderShell();
    unsub.push(B.watchUsers(u => { USERS = u; renderMain(); const me = USERS.find(x => x.uid === ME.uid); const w = $(".who"); if (w && me) w.textContent = me.name + (ME.isAdmin ? " · админ" : ""); }));
    unsub.push(B.watchTasks(t => { TASKS = t; renderMain(); }));
    unsub.push(B.watchKpi(k => { KPI = k; renderMain(); }));
    unsub.push(B.watchPoints(p => { POINTS = p; renderMain(); }));
  });
})();
</script>
</body>
